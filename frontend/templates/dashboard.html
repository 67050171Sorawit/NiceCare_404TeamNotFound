        color: red;

    .card {
        width: 350px;
        margin: auto;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-top: 20px;
    }

    .call-btn {
        display: block;
        margin: 10px;
        padding: 12px;
        background: red;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .call-btn:hover {
        background: darkred;
    }
</style>
```

</head>

<body>

```
<h1>NiceCare Dashboard</h1>

{% if status == "FALL DETECTED" %}
    <h2 class="fall">🚨 {{ status }}</h2>
{% else %}
    <h2 class="normal">✅ {{ status }}</h2>
{% endif %}

<h3>Last Update: {{ time }}</h3>

{% if status == "FALL DETECTED" %}
<div class="card">

    <h2>Emergency Contacts</h2>

    <a class="call-btn"
       href="tel:0812345678">

    </a>

    <a class="call-btn"
       href="tel:0898765432">

    </a>

    <a class="call-btn"
       href="tel:0851112222">

</div>
{% endif %}
