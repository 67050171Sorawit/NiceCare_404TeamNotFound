<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NiceCare Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins', sans-serif;
            background:#eef2f7;
            color:#2c3e50;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar{

            position:fixed;

            left:0;
            top:0;

            width:240px;
            height:100vh;

            background:#1f2937;

            padding:30px 20px;
        }

        .logo-section{

            text-align:center;

            margin-bottom:40px;
        }

        .logo-section img{

            width:90px;

            margin-bottom:15px;
        }

        .logo{

            color:white;

            font-size:28px;

            font-weight:700;
        }

        .menu a{

            display:block;

            color:#d1d5db;

            text-decoration:none;

            padding:15px;

            border-radius:12px;

            margin-bottom:10px;

            transition:0.3s;
        }

        .menu a:hover{

            background:#374151;

            color:white;
        }

        /* =========================
           MAIN
        ========================= */

        .main{

            margin-left:240px;

            padding:30px;
        }

        .topbar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;
        }

        .topbar h1{

            font-size:32px;

            font-weight:700;
        }

        .user-box{

            background:white;

            padding:12px 20px;

            border-radius:15px;

            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        /* =========================
           CARDS
        ========================= */

        .cards{

            display:grid;

            grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));

            gap:20px;

            margin-bottom:30px;
        }

        .card{

            background:white;

            padding:25px;

            border-radius:20px;

            box-shadow:0 6px 20px rgba(0,0,0,0.08);

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-5px);
        }

        .card h2{

            font-size:18px;

            color:#6b7280;

            margin-bottom:15px;
        }

        .status{

            font-size:32px;

            font-weight:700;
        }

        .online{
            color:#10b981;
        }

        .normal{
            color:#3b82f6;
        }

        /* =========================
           SOS BUTTON
        ========================= */

        .sos-section{

            margin-bottom:30px;

            text-align:center;
        }

        .sos-btn{

            background:red;

            color:white;

            border:none;

            padding:18px 45px;

            border-radius:18px;

            font-size:24px;

            font-weight:bold;

            cursor:pointer;

            box-shadow:0 8px 25px rgba(255,0,0,0.3);

            transition:0.3s;
        }

        .sos-btn:hover{

            transform:scale(1.05);

            background:#dc2626;
        }

        /* =========================
           CAMERA
        ========================= */

        .camera-section{

            background:white;

            border-radius:25px;

            padding:20px;

            box-shadow:0 6px 20px rgba(0,0,0,0.08);

            margin-bottom:30px;
        }

        .camera-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:20px;
        }

        .live-dot{

            width:12px;

            height:12px;

            background:red;

            border-radius:50%;

            display:inline-block;

            margin-right:8px;

            animation:blink 1s infinite;
        }

        @keyframes blink{

            0%{opacity:1;}

            50%{opacity:0.3;}

            100%{opacity:1;}
        }

        .camera-box{

            width:100%;

            height:550px;

            border-radius:20px;

            overflow:hidden;

            background:black;
        }

        .camera-box img{

            width:100%;

            height:100%;

            object-fit:cover;

            display:block;
        }

        /* =========================
           ALERTS
        ========================= */

        .alerts{

            background:white;

            border-radius:25px;

            padding:25px;

            box-shadow:0 6px 20px rgba(0,0,0,0.08);
        }

        .alerts h2{

            margin-bottom:20px;
        }

        .alert-item{

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:15px;

            background:#f9fafb;

            border-radius:12px;

            margin-bottom:12px;
        }

        .alert-status{

            color:#ef4444;

            font-weight:600;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:900px){

            .sidebar{

                width:100%;

                height:auto;

                position:relative;
            }

            .main{

                margin-left:0;
            }

            .camera-box{

                height:300px;
            }
        }

    </style>

</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <div class="logo-section">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
            >

            <div class="logo">
                NiceCare
            </div>

        </div>

        <div class="menu">

            <a href="#">🏠 Dashboard</a>

            <a href="#">📷 Camera</a>

            <a href="#">🔔 Notifications</a>

            <a href="/logout">🚪 Logout</a>

        </div>

    </div>

    <!-- =========================
         MAIN
    ========================== -->

    <div class="main">

        <div class="topbar">

            <h1>
                Elderly Monitoring System
            </h1>

            <div class="user-box">

                Welcome, {{ username }}

            </div>

        </div>

        <!-- =========================
             STATUS CARDS
        ========================== -->

        <div class="cards">

            <div class="card">

                <h2>Camera Status</h2>

                <div class="status online">

                    {{ camera_status }}

                </div>

            </div>

            <div class="card">

                <h2>Fall Detection</h2>

                <div class="status normal">

                    {{ fall_status }}

                </div>

            </div>

        </div>

        <!-- =========================
             SOS BUTTON
        ========================== -->

        <div class="sos-section">

            <button class="sos-btn">

                🚨 EMERGENCY SOS

            </button>

        </div>

        <!-- =========================
             CAMERA
        ========================== -->

        <div class="camera-section">

            <div class="camera-header">

                <h2>Live Camera</h2>

                <div>

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>

            <div class="camera-box">

                <img src="/video">

            </div>

        </div>

        <!-- =========================
             ALERT HISTORY
        ========================== -->

        <div class="alerts">

            <h2>Alert History</h2>

            {% for alert in alerts %}

            <div class="alert-item">

                <div>

                    {{ alert }}

                </div>

                <div class="alert-status">

                    Monitoring

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
